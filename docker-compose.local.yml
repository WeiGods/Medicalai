# Use together with docker-compose.yml and --profile local-ai.
# All model files must already exist beneath ASR_MODELS_DIR on the host.
services:
  api:
    environment:
      MINIO_API_ENDPOINT: http://minio:9000
      DASHSCOPE_API_KEY: ""
  ai:
    environment:
      ASR_OFFLINE: "1"
      ASR_MODEL: ${ASR_MODEL:-/models/Fun-ASR-Nano-2512}
      ASR_VAD_MODEL: ${ASR_VAD_MODEL:-/models/fsmn-vad}
      ASR_SPK_MODEL: ${ASR_SPK_MODEL:-/models/eres2netv2}
