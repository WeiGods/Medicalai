services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://192.168.1.30:5432/medicalai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      AI_SERVICE_BASE_URL: http://ai:8000
      STORAGE_ROOT: /data/recordings
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - medicalai_recordings:/data/recordings
  ai:
    build: ./ai_service
    ports:
      - "8000:8000"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicalai
      POSTGRES_USER: medicalai
      POSTGRES_PASSWORD: medicalai
    volumes:
      - medicalai_pg:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medicalai
      MINIO_ROOT_PASSWORD: medicalai-demo-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medicalai_minio:/data
  funasr:
    image: medicalai-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace/Fun-ASR
    stdin_open: true
    tty: true
    ports:
      - "10095:10095"
    environment:
      - HF_HOME=/workspace/.cache/huggingface
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - VLLM_USE_FLASHINFER_SAMPLER=0
    volumes:
      - .:/workspace/Fun-ASR
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  medicalai_pg:
  medicalai_minio:
  medicalai_recordings:
