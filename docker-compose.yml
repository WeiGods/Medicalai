services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://192.168.1.30:5432/medicalai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AI_SERVICE_BASE_URL: http://ai:8000
      STORAGE_ROOT: /data/recordings
      MINIO_API_ENDPOINT: ${MINIO_API_ENDPOINT:-http://106.55.225.222:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_NAME: medicalai
      MINIO_FOLDER_PREFIX: medicalai
      MINIO_ANONYMOUS_READ: "true"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      DASHSCOPE_ENDPOINT: https://dashscope.aliyuncs.com
      DASHSCOPE_ASR_MODEL: qwen-audio-3.0-asr-flash-filetrans
    ports:
      - "8080:8189"
    depends_on:
      - ai
    volumes:
      - medicalai_data:/data
  ai:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    environment:
      ASR_DEVICE: cuda:0
      ASR_HUB: ms
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-30}
    ports:
      - "8000:8000"
    volumes:
      - medicalai_models:/workspace/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medicalai
      MINIO_ROOT_PASSWORD: medicalai-demo-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medicalai_minio:/data
volumes:
  medicalai_data:
  medicalai_models:
  medicalai_minio:
